doc_type: eoa_letter
match_any: ["Extension of Approval", "EOA"]
fields:
  file_no:        {patterns: ['F\.?\s?No\.?\s*:?\s*(\S+/\S+)'], type: text}
  approval_date:  {patterns: ['(?:Date of Approval|Date)\s*:?\s*(\d{1,2}[-/ ][A-Za-z0-9]{2,9}[-/ ]\d{4})'], type: date}
  permanent_id:   {patterns: ['Permanent Id\s*:?\s*(1-\d+)'], type: text}
  application_id: {patterns: ['Application Id\s*:?\s*(1-\d+)'], type: text}
  institute_name: {labels: ['Name of the Institution'], patterns: ['Name of the Institution\s*:\s*(.+)'], type: text}
  academic_year:  {patterns: ['Academic Year\s*:?\s*(\d{4}-\d{2})'], type: text}
  printed_on:     {patterns: ['Printed On\s*:?\s*(\d{1,2}[-/ ][A-Za-z0-9]{2,9}[-/ ,]+\d{4})'], type: date}
tables:
  programs:
    columns:
      course:      {match: ['course'], pick: first}
      intake_prev: {match: ['intake'], pick: first}
      intake_curr: {match: ['intake'], pick: last}
expected_producers: ["Oracle BI Publisher", "SYNTH-PORTAL"]
expected_fonts: []
