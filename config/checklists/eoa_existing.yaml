# WK23-3 checklist for Extension of Approval (existing institutions). One row per requirement.
# A row turns RED for a return_for_rectification finding, AMBER for a human_review finding, GREEN when its documents are
# present (or not required by the rules) and no finding hits it, GREY when it is not automated (the officer checks by hand).
# A finding hits a row if its rule id starts with one of `rules`, or it is about one of the row's documents (`doc_types`).
# Clause references as in the rules sheet (R01-R08 = Annexure-2 2.1 i.-viii.); item texts for vii./viii. are left to the sheet.
rows:
  - {id: R01, ref: "ANNEXURE-2 2.1 i.", item: "Affidavit 2 on e-stamp paper of Rs. 100, digitally signed", doc_types: [affidavit_2], rules: [R-MISS-affidavit_2, R-FLD-affidavit_2, R-SIG-affidavit_2, X-SWORN]}
  - {id: R02, ref: "ANNEXURE-2 2.1 ii.", item: "Fee paid on the AICTE portal for this academic year", rules: [R-REC-ter_paid]}
  - {id: R03, ref: "ANNEXURE-2 2.1 iii.", item: "Occupancy / Completion Certificate (Building License / Form D)", doc_types: [occupancy_cert], rules: [R-MISS-occupancy_cert, R-PROV-occupancy_cert]}
  - {id: R04, ref: "ANNEXURE-2 2.1 iv.", item: "Structural Stability Certificate (building over 30 years)", doc_types: [structural_cert], rules: [R-MISS-structural_cert, R-EXP-structural_cert]}
  - {id: R05, ref: "ANNEXURE-2 2.1 v.", item: "Valid Fire Safety Certificate", doc_types: [fire_cert], rules: [R-MISS-fire_cert, R-EXP-fire_cert, R-FLD-fire_cert]}
  - {id: R06, ref: "ANNEXURE-2 2.1 vi.", item: "Campus location (geo-coordinates / satellite map)", rules: [X-GEO, F-PHOTO-GPS]}
  - {id: R07, ref: "ANNEXURE-2 2.1 vii.", item: "Item as in the rules sheet (R07)", automated: false}
  - {id: R08, ref: "ANNEXURE-2 2.1 viii.", item: "Item as in the rules sheet (R08)", automated: false}
  - {id: NOC, ref: null, item: "University NOC (Format 2) matches approved intake", doc_types: [noc_format2], rules: [X-INTAKE, R-FLD-noc_format2]}
  - {id: AREA, ref: null, item: "Built-up area meets the Handbook norms", doc_types: [area_statement], rules: [R-AREA]}
  - {id: EOA, ref: null, item: "Previous EoA letter matches this institute and year", doc_types: [eoa_letter], rules: [R-MISS-eoa_letter, X-PERMID, X-APPID, X-YOY]}
  - {id: PHOTO, ref: null, item: "Campus photos (location, duplicates, edits)", rules: [F-PHOTO, X-REUSE-PHOTO, F-META-EXIF, F-META-JPEG]}
  - {id: XDOC, ref: null, item: "Documents consistent with each other and not reused", rules: [X-NAME, X-REUSE-CERT, X-SERIAL]}
  - {id: LAND, ref: null, item: "Land documents", automated: false}
