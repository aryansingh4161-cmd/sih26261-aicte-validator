# All numbers here are ASSUMPTIONS (configurable), not AICTE rules.
sla_days: {high: 2, medium: 5, low: 7, info: 10}
expiry_warning_days: 60
tamper_threshold: 0.136        # image score; chosen on VALIDATION for FPR ~5%: seed-7 val split regenerated (n=300: 139 clean,
                               # 161 tampered), FPR 7/139 = 5.0%, TPR 158/161 = 98.1% (measured, WK15, Kaggle weights epoch 10)
tamper_mode: single              # WK22: single (model 1) | ensemble (mean of model 1 + model 2 heatmaps). Ensemble stays OFF until
tamper_weights_2: data/models/model2_tamper_unet.pt   # tools/ensemble_eval.py shows it beats model 1 on ood_layout and loses <= 0.02 AUC
tamper_threshold_ensemble: null  # elsewhere; its threshold is then chosen on VALIDATION at the same 5% false-alarm target (designed)
name_match_threshold: 0.85     # name similarity below this = mismatch
photo_max_km: 1.0              # photo GPS farther than this from declared location = flag
blur_threshold: 60.0           # variance of Laplacian below this = blurry (tune on demo photos)
# F10 inspection priority: designed weights, ASSUMPTION, not trained. Per finding by severity; flags added once; capped at 1.0.
priority_weights: {high: 0.25, medium: 0.1, low: 0.03, suspected_anomaly: 0.2, old_building: 0.1, old_building_years: 30,
                   noc_intake_above_approved: 0.15}
# MOCK asynchronous issuer webhook (pramaan/issuer_async.py). DEMO secret, NOT a real credential: replace via a secret store in production.
issuer_webhook_secret: "DEMO-ONLY-pramaan-issuer-webhook-secret-not-for-production"
# Retention (tools/retention.py): output files, heatmaps and uploaded-document copies older than this are deleted.
retention_days: 30             # ASSUMPTION (no AICTE retention period found yet); audit.db is NEVER deleted
